<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jogos · Rapadura Cósmica</title>
    <meta
      name="description"
      content="Jogos de astronomia para jogar no navegador, feitos para as aulas do canal Rapadura Cósmica."
    />
  </head>
  <body>
    <!--
      Portal de jogos (games.rapaduracosmica.com.br).
      Layout provisório: o visual final vem do Claude Design. Mantenha os ids usados em portal/main.ts.
    -->
    <header class="topo">
      <div class="faixa" id="seloPortal"></div>
    </header>

    <main>
      <section class="abertura faixa">
        <div class="eyebrow">Jogos de astronomia</div>
        <h1>Aprenda o céu <em>jogando</em></h1>
        <p>Jogos para o navegador, feitos para as aulas do canal. Escolha um, chame a turma e boa viagem.</p>
      </section>

      <section class="faixa" aria-labelledby="tituloJogos">
        <h2 id="tituloJogos" class="secao">Escolha um jogo</h2>
        <ul class="grade-jogos" id="listaJogos"></ul>
        <p class="vazio" id="semJogos" hidden>Nenhum jogo publicado ainda.</p>
      </section>

      <section class="canal" aria-labelledby="tituloCanal">
        <div class="faixa canal__conteudo">
          <div>
            <div class="eyebrow">Sobre o canal</div>
            <h2 id="tituloCanal">Rapadura Cósmica</h2>
            <p id="textoCanal"></p>
          </div>
          <div id="linksCanal"></div>
        </div>
      </section>
    </main>

    <footer class="rodape faixa">
      <span id="rodapeTexto"></span>
    </footer>

    <script type="module" src="./portal/main.ts"></script>
  </body>
</html>
